<div class="modal-dialog customdilog" role="document">
   <div class="modal-content" >
      <div class="modal-header model-title">
         <h2 class="text-white fontstylenew">Let's Convert Your Idea into Reality</h2>
      </div>
      <form id="quoteForm" action="/request-qoute/" method="POST" enctype="multipart/form-data">
         <div class="modal-body">
            <div class="new-form-row">
               <div class="col-lg-6 new-col-lg-6">
                  <div class="form-group">
                     <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-user" aria-hidden="true"></i></span>
                        <input name="dzName" type="text" required="" title="Enter full name" class="form-control" placeholder="Full Name">
                     </div>
                  </div>
               </div>
               <div class="col-lg-6 new-col-lg-6">
                  <div class="form-group">
                     <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-envelope-o" aria-hidden="true"></i></span>
                        <input name="dzEmail" type="email" class="form-control" required="" placeholder="Your Email Id">
                     </div>
                  </div>
               </div>
               <div class="col-lg-6 new-col-lg-6">
                  <div class="form-group">
                     <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-mobile" aria-hidden="true"></i></span>
                        <input name="dzOther[Phone]" type="text" required="" pattern="[0-9]{10-15}" class="form-control" oninvalid="this.setCustomValidity('Please enter valid phone number')" oninput="this.setCustomValidity('')" placeholder="Phone">
                     </div>
                  </div>
               </div>
               <div class="col-lg-12">
                  <div class="form-group">
                     <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></span>
                        <textarea name="dzMessage" rows="4" class="form-control" required="" placeholder="Tell us about your project or idea"></textarea>
                     </div>
                  </div>
               </div>
               <div class="col-lg-12" style="margin-left: 31px;">
                  <div class="form-group">
                     <div class="input-group">
                        <div class="g-recaptcha" data-sitekey="6LfF8NUqAAAAAIlII_bmEg2UzNCCuC_mp1Kkij7n"></div>
                     </div>
                  </div>
               </div>
               <div class="col-lg-12 text-center mt-4">
                  <button class="site-button button-lg submitquote" id="submitquote" name="submit" type="submit" value="Submit" > <span>Get A Free Demo!</span> </button>
               </div>
               <div id="Succcessmsg"  style="display:none;padding: 15px;margin-top: 15px; margin-bottom: 10px; border-radius: 5px; font-size: 14px;  font-family: Arial, sans-serif; color: #155724; border: 2px solid #90f3a1;  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); "></div>
            </div>
      </form>
      </div>
   </div>
</div>
