<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .email-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }
        h2 {
            color: #007BFF;
            text-align: center;
        }
        .details {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            padding: 10px;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h2>New Quote Request</h2>
        <p class="details"><strong>Name:</strong> {{ full_name }}</p>
        <p class="details"><strong>Email:</strong> {{ email }}</p>
        <p class="details"><strong>Phone:</strong> {{ phone_no }}</p>
        <p class="details"><strong>Message:</strong> {{ message }}</p>
        <p class="details"><strong>Page Path:</strong> {{ page_path }}</p>
        
        <div class="footer">
            <p>This is an automated email. Please do not reply.</p>
        </div>
    </div>
</body>
</html>
