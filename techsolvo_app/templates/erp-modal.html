{% load static %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<button class="book-a-demo" id="bookDemo">BOOK A DEMO</button>
<div id="demoModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="demoModalLabel" aria-hidden="true">
   <div class="modal-dialog customdilog" role="document">
      <div class="modal-content" >
         <div class="modal-header model-title">
            <h2 class="text-white fontstylenew">Transform Your Business with ERP</h2>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="closeModal">
               <span aria-hidden="true">&times;</span>
            </button>
         </div>
         <form id="quoteForm" method="POST" action="{%url 'request_quote'%}">
            <div class="modal-body">
               <div class="new-form-row">
                  <div class="col-lg-6 new-col-lg-6">
                     <div class="form-group">
                        <div class="input-group">
                           <span class="input-group-text"><i class="fa fa-user" aria-hidden="true"></i></span>
                           <input name="dzName" type="text" required="" title="Enter full name" class="form-control" placeholder="Full Name">
                        </div>
                     </div>
                  </div>
                  <div class="col-lg-6 new-col-lg-6">
                     <div class="form-group">
                        <div class="input-group">
                           <span class="input-group-text"><i class="fa fa-envelope-o" aria-hidden="true"></i></span>
                           <input name="dzEmail" type="email" class="form-control" required="" placeholder="Your Email Id">
                        </div>
                     </div>
                  </div>
                  <div class="col-lg-6 new-col-lg-6">
                     <div class="form-group">
                        <div class="input-group">
                           <span class="input-group-text"><i class="fa fa-mobile" aria-hidden="true"></i></span>
                           <input name="dzOther[Phone]" type="text" required="" maxlength=15 pattern="[0-9]{10-15}" class="form-control" oninvalid="this.setCustomValidity('Please enter valid phone number')" oninput="this.setCustomValidity('')" placeholder="Phone">
                        </div>
                     </div>
                  </div>
                  <div class="col-lg-12">
                     <div class="form-group">
                        <div class="input-group">
                           <span class="input-group-text"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></span>
                           <textarea name="dzMessage" rows="4" class="form-control" required="" placeholder="Message"></textarea>
                        </div>
                     </div>
                  </div>
                  <div class="col-lg-12 text-center mt-4">
                     <button class="site-button button-lg submitquote" id="submitquote" name="submit" type="submit" value="Submit" > <span>Get A Free Demo!</span> </button>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
</div>
{% block scripts %}
<!-- Book a Demo -->
<script>
   $(document).ready(function() {
      var hasShownPopup = false;

      function showDemoPopup() {
        $('#demoModal').modal('show');
        hasShownPopup = true;
      }

      function handleFormSubmission(event) {
        event.preventDefault();

        var form = $('#quoteForm')[0];
        if (!form.checkValidity()) {
          $('<div class="alert alert-danger">Please fill out all the required fields.</div>')
            .insertBefore('#demoModal .modal-body')
            .delay(3000)
            .fadeOut();
          return false;
        }

        var formData = new FormData(form);
        formData.append('page_path', document.location.pathname);
        $.ajax({
          url: "{% url 'request_quote' %}",
          type: 'POST',
          data: formData,
          processData: false,
          contentType: false
        }).then(function(response) {
          $('#demoModal').modal('hide');
          if (response.status) {
            Swal.fire("Success!", "Your ENQUIRY has been received successfully. We will connect with you shortly.", "success");
          } else {
            Swal.fire("Error!", "Something went wrong. Please try again later.", "error");
          }
        }).fail(function(xhr, status, error) {
          $('#demoModal').modal('hide');
          Swal.fire("Error!", "Something went wrong. Please try again later.", "error");
        });
      }

      $('.book-a-demo').on('click', function() {
        showDemoPopup();
      });

      $(document).on('scroll', function() {
        if (!hasShownPopup && $(this).scrollTop() > 700) {
          showDemoPopup();
        }
      });

      // Attach the form submission handler once
      $('#quoteForm').on('submit', handleFormSubmission);

      $('#closeModal').on('click', function() {
        $('#demoModal').modal('hide');
      });
   });
</script>
{% endblock scripts %}
